[project]
name = "agent-course-agentic-rag-python"
version = "0.1.0"
description = "Agentic RAG workflow with retrieval planning, evidence checking and grounded answer validation"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.15",
    "langchain-deepseek==1.1.0",
    "langgraph==1.2.11",
    "pydantic==2.13.4",
    "typing-extensions==4.15.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agentic_rag",
    "fixtures",
    "knowledge",
    "models",
    "workflow",
]
