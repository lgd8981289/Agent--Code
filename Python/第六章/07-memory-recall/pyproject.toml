[project]
name = "agent-course-memory-recall-python"
version = "0.1.0"
description = "Recall exact preferences and semantic historical memories before building model input"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.15",
    "langchain-deepseek==1.1.0",
    "langgraph==1.2.11",
    "numpy==2.3.5",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "fixtures",
    "memory_recall",
    "models",
    "recall",
]
